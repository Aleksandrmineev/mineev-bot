[project]
name = "karriere-telegram-parser"
version = "0.1.0"
description = "Personal Telegram notifier for new karriere.at job postings matching saved searches."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "python-telegram-bot>=21.0",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "playwright>=1.50",
    "openai>=1.100",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

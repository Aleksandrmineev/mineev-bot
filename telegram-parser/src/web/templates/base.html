<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}karriere-telegram-parser{% endblock %}</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 980px;
    margin: 0 auto;
    padding: 1.5rem 1rem 4rem;
    line-height: 1.5;
    color: light-dark(#1a1a1a, #eaeaea);
    background: light-dark(#fff, #14161a);
  }
  nav { display: flex; gap: 1.25rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid light-dark(#e2e2e2, #2a2d33); }
  nav a { color: inherit; text-decoration: none; font-weight: 600; opacity: 0.7; }
  nav a.active, nav a:hover { opacity: 1; }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; }
  h2 { font-size: 1.05rem; margin: 2rem 0 0.75rem; }
  table { width: 100%; border-collapse: collapse; margin: 0.75rem 0 1.5rem; font-size: 0.92rem; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid light-dark(#eee, #23262c); vertical-align: top; }
  th { font-weight: 600; color: light-dark(#666, #9aa0aa); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.02em; }
  tr:last-child td { border-bottom: none; }
  a.job-link { color: light-dark(#0b63c5, #6cb1ff); text-decoration: none; }
  a.job-link:hover { text-decoration: underline; }
  .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }
  .badge.ok { background: light-dark(#e4f7ea, #113822); color: light-dark(#1a7f41, #4ade80); }
  .badge.warn { background: light-dark(#fdeee0, #3a2712); color: light-dark(#c46a10, #f5a95e); }
  .badge.off { background: light-dark(#f1f1f1, #23262c); color: light-dark(#777, #9aa0aa); }
  .error-box { background: light-dark(#fdeaea, #3a1616); color: light-dark(#b3261e, #f5a3a0); padding: 0.75rem 1rem; border-radius: 8px; margin: 1rem 0; }
  .muted { color: light-dark(#888, #7d838c); font-size: 0.88rem; }
  form.row { display: flex; gap: 0.5rem; margin: 0.75rem 0 1.5rem; }
  input[type=text], input[type=url] {
    flex: 1; padding: 0.55rem 0.7rem; border-radius: 6px;
    border: 1px solid light-dark(#ccc, #383c44); background: light-dark(#fff, #1b1d22); color: inherit; font-size: 0.92rem;
  }
  button, .btn {
    padding: 0.55rem 1rem; border-radius: 6px; border: 1px solid light-dark(#ccc, #383c44);
    background: light-dark(#f5f5f5, #23262c); color: inherit; cursor: pointer; font-size: 0.88rem;
  }
  button.primary { background: light-dark(#0b63c5, #2563eb); color: #fff; border-color: transparent; }
  button.danger { background: transparent; color: light-dark(#c0392b, #f28b82); border-color: light-dark(#e6b0aa, #4a2c2a); }
  form.inline { display: inline; }
  form.quick-form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin: 0.75rem 0; align-items: center; }
  form.quick-form input[type=number] {
    padding: 0.55rem 0.7rem; border-radius: 6px; width: 100%;
    border: 1px solid light-dark(#ccc, #383c44); background: light-dark(#fff, #1b1d22); color: inherit; font-size: 0.92rem;
  }
  form.quick-form label.checkbox { display: flex; align-items: center; gap: 0.45rem; font-size: 0.9rem; }
  form.quick-form button { grid-column: 1 / -1; justify-self: start; }
  .card { border: 1px solid light-dark(#e2e2e2, #2a2d33); border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
  .stat-row { display: flex; gap: 1.5rem; flex-wrap: wrap; }
  .stat { min-width: 140px; }
  .stat .label { font-size: 0.78rem; text-transform: uppercase; color: light-dark(#888, #7d838c); letter-spacing: 0.03em; }
  .stat .value { font-size: 1.05rem; font-weight: 600; margin-top: 0.15rem; }
  .source-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.75rem; }
  .source-card { margin-bottom: 0; }
  .source-card-head { display: flex; justify-content: space-between; gap: 0.75rem; align-items: center; }
  .button-link { display: inline-block; padding: 0.45rem 0.8rem; border-radius: 6px; background: light-dark(#f5f5f5, #23262c); color: inherit; text-decoration: none; border: 1px solid light-dark(#ccc, #383c44); font-size: 0.88rem; }
  code { background: light-dark(#f1f1f1, #23262c); padding: 0.1rem 0.35rem; border-radius: 4px; font-size: 0.85em; }
</style>
</head>
<body>
<nav>
  <a href="/" class="{% block nav_dashboard %}{% endblock %}">Дашборд</a>
  <a href="/preview" class="{% block nav_preview %}{% endblock %}">Предпросмотр поиска</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
